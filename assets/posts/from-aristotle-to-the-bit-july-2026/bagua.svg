<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      .line-solid { stroke: #1a1a1a; stroke-width: 8; stroke-linecap: round; }
      .line-broken { stroke: #1a1a1a; stroke-width: 8; stroke-linecap: round; }
      .label { font-family: serif; font-size: 11px; fill: #333; text-anchor: middle; }
      .center-label { font-family: serif; font-size: 13px; fill: #555; text-anchor: middle; font-style: italic; }
      @media (prefers-color-scheme: dark) {
        .line-solid { stroke: #e8e0d0; }
        .line-broken { stroke: #e8e0d0; }
        .label { fill: #ccc; }
        .center-label { fill: #aaa; }
      }
    </style>
  </defs>

  <!-- Outer circle -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#888" stroke-width="1.5" opacity="0.4"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#888" stroke-width="1" opacity="0.25"/>

  <!-- Center text -->
  <text class="center-label" x="200" y="195">Bagua</text>
  <text class="center-label" x="200" y="213">八卦</text>

  <!--
    8 trigrams in Fuxi (Early Heaven) arrangement, clockwise from top:
    0° top    = ☰ Qian (Heaven)   111
    45°       = ☱ Dui (Lake)      110
    90° right = ☲ Li (Fire)       101
    135°      = ☳ Zhen (Thunder)  100
    180° bot  = ☷ Kun (Earth)     000
    225°      = ☶ Gen (Mountain)  001
    270° left = ☵ Kan (Water)     010
    315°      = ☴ Xun (Wind)      011

    Each trigram: 3 lines, rendered as a small group rotated to face outward.
    Lines drawn at radius ~148 from center, each group is a 3-line stack.
    Line width ~28px, gap between broken halves ~6px, spacing between lines ~10px.
  -->

  <!-- Helper: draw trigram group. Each trigram is drawn as a <g> rotated around center. -->
  <!-- We'll position each group at angle, translate outward, then draw 3 lines (bottom to top). -->
  <!-- Solid line = one stroke. Broken line = two strokes with gap. -->

  <!-- ── QIAN ☰  (top, 0°)  111 all solid -->
  <g transform="translate(200,200) rotate(0)">
    <g transform="translate(0,-148)">
      <!-- bottom line (solid) --> <line x1="-20" y1="18" x2="20" y2="18" class="line-solid"/>
      <!-- middle line (solid) --> <line x1="-20" y1="6"  x2="20" y2="6"  class="line-solid"/>
      <!-- top line    (solid) --> <line x1="-20" y1="-6" x2="20" y2="-6" class="line-solid"/>
      <text class="label" x="0" y="-22">☰ Qián</text>
      <text class="label" x="0" y="34">111</text>
    </g>
  </g>

  <!-- ── DUI ☱  (45°)  110 top broken -->
  <g transform="translate(200,200) rotate(45)">
    <g transform="translate(0,-148)">
      <!-- bottom --> <line x1="-20" y1="18" x2="20" y2="18" class="line-solid"/>
      <!-- middle --> <line x1="-20" y1="6"  x2="20" y2="6"  class="line-solid"/>
      <!-- top broken --> <line x1="-20" y1="-6" x2="-4" y2="-6" class="line-broken"/>
                          <line x1="4"  y1="-6" x2="20" y2="-6" class="line-broken"/>
      <text class="label" x="0" y="-22">☱ Duì</text>
      <text class="label" x="0" y="34">110</text>
    </g>
  </g>

  <!-- ── LI ☲  (90°)  101 middle broken -->
  <g transform="translate(200,200) rotate(90)">
    <g transform="translate(0,-148)">
      <!-- bottom --> <line x1="-20" y1="18" x2="20" y2="18" class="line-solid"/>
      <!-- middle broken --> <line x1="-20" y1="6" x2="-4" y2="6" class="line-broken"/>
                             <line x1="4"  y1="6" x2="20" y2="6" class="line-broken"/>
      <!-- top --> <line x1="-20" y1="-6" x2="20" y2="-6" class="line-solid"/>
      <text class="label" x="0" y="-22">☲ Lí</text>
      <text class="label" x="0" y="34">101</text>
    </g>
  </g>

  <!-- ── ZHEN ☳  (135°)  100 only bottom solid -->
  <g transform="translate(200,200) rotate(135)">
    <g transform="translate(0,-148)">
      <!-- bottom --> <line x1="-20" y1="18" x2="20" y2="18" class="line-solid"/>
      <!-- middle broken --> <line x1="-20" y1="6" x2="-4" y2="6" class="line-broken"/>
                             <line x1="4"  y1="6" x2="20" y2="6" class="line-broken"/>
      <!-- top broken --> <line x1="-20" y1="-6" x2="-4" y2="-6" class="line-broken"/>
                          <line x1="4"  y1="-6" x2="20" y2="-6" class="line-broken"/>
      <text class="label" x="0" y="-22">☳ Zhèn</text>
      <text class="label" x="0" y="34">100</text>
    </g>
  </g>

  <!-- ── KUN ☷  (180°)  000 all broken -->
  <g transform="translate(200,200) rotate(180)">
    <g transform="translate(0,-148)">
      <!-- bottom broken --> <line x1="-20" y1="18" x2="-4" y2="18" class="line-broken"/>
                             <line x1="4"  y1="18" x2="20" y2="18" class="line-broken"/>
      <!-- middle broken --> <line x1="-20" y1="6" x2="-4" y2="6" class="line-broken"/>
                             <line x1="4"  y1="6" x2="20" y2="6" class="line-broken"/>
      <!-- top broken --> <line x1="-20" y1="-6" x2="-4" y2="-6" class="line-broken"/>
                          <line x1="4"  y1="-6" x2="20" y2="-6" class="line-broken"/>
      <text class="label" x="0" y="-22">☷ Kūn</text>
      <text class="label" x="0" y="34">000</text>
    </g>
  </g>

  <!-- ── GEN ☶  (225°)  001 only top solid -->
  <g transform="translate(200,200) rotate(225)">
    <g transform="translate(0,-148)">
      <!-- bottom broken --> <line x1="-20" y1="18" x2="-4" y2="18" class="line-broken"/>
                             <line x1="4"  y1="18" x2="20" y2="18" class="line-broken"/>
      <!-- middle broken --> <line x1="-20" y1="6" x2="-4" y2="6" class="line-broken"/>
                             <line x1="4"  y1="6" x2="20" y2="6" class="line-broken"/>
      <!-- top solid --> <line x1="-20" y1="-6" x2="20" y2="-6" class="line-solid"/>
      <text class="label" x="0" y="-22">☶ Gèn</text>
      <text class="label" x="0" y="34">001</text>
    </g>
  </g>

  <!-- ── KAN ☵  (270°)  010 only middle solid -->
  <g transform="translate(200,200) rotate(270)">
    <g transform="translate(0,-148)">
      <!-- bottom broken --> <line x1="-20" y1="18" x2="-4" y2="18" class="line-broken"/>
                             <line x1="4"  y1="18" x2="20" y2="18" class="line-broken"/>
      <!-- middle solid --> <line x1="-20" y1="6" x2="20" y2="6" class="line-solid"/>
      <!-- top broken --> <line x1="-20" y1="-6" x2="-4" y2="-6" class="line-broken"/>
                          <line x1="4"  y1="-6" x2="20" y2="-6" class="line-broken"/>
      <text class="label" x="0" y="-22">☵ Kǎn</text>
      <text class="label" x="0" y="34">010</text>
    </g>
  </g>

  <!-- ── XUN ☴  (315°)  011 only top broken -->
  <g transform="translate(200,200) rotate(315)">
    <g transform="translate(0,-148)">
      <!-- bottom broken --> <line x1="-20" y1="18" x2="-4" y2="18" class="line-broken"/>
                             <line x1="4"  y1="18" x2="20" y2="18" class="line-broken"/>
      <!-- middle solid --> <line x1="-20" y1="6" x2="20" y2="6" class="line-solid"/>
      <!-- top solid --> <line x1="-20" y1="-6" x2="20" y2="-6" class="line-solid"/>
      <text class="label" x="0" y="-22">☴ Xùn</text>
      <text class="label" x="0" y="34">011</text>
    </g>
  </g>

</svg>
