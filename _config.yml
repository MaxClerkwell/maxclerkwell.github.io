title: "Stephan Bökelmann"
tagline: "From tape-out to TypeScript."
email: "stephan@boekelmann.net"
url: "https://maxclerkwell.tech"
baseurl: ""
description: >-
  Engineer, physicist, and lecturer at THGA Bochum. I write about decentralised DAQ,
  particle physics instrumentation, embedded systems, and manufacturing — usually one post per week.
author:
  name: "Stephan Bökelmann"
  email: "stephan@boekelmann.net"
  uri: "https://maxclerkwell.tech"

lang: en

feed:
  title: "Stephan Bökelmann — From tape-out to TypeScript"
  subtitle: >-
    Engineer, physicist, consultant. Silicon-level measurement systems,
    embedded development, monitoring infrastructure, and application-layer
    software.
  path: feed.xml
  posts_limit: 20

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: null

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

include:
  - .well-known

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .claude/
  - AGENTS.md
  - CLAUDE.md
  - "*.sh"

collections:
  articles:
    output: true
    permalink: /posts/:name/

defaults:
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "post"
