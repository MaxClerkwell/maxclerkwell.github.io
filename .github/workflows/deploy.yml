name: Deploy Jekyll site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # private submodules are not needed for the build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow: tell Bing/Yandex/Seznam that the sitemap changed, so new
      # posts get picked up in minutes instead of days. The key file must stay
      # reachable at https://maxclerkwell.tech/<key>.txt or the ping is ignored.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 9e3190695c25359245a018b00868615f
        run: |
          curl -sS -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"maxclerkwell.tech\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://maxclerkwell.tech/$INDEXNOW_KEY.txt\",\"urlList\":[\"https://maxclerkwell.tech/\",\"https://maxclerkwell.tech/sitemap.xml\"]}" \
            -w "\nIndexNow HTTP %{http_code}\n"
